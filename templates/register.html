{% extends "base.html" %}{% block title %}Register | ShopEasy{% endblock %}{% block content %}<div class="auth-wrap"><form class="form-card" method="post"><p class="eyebrow">JOIN SHOPEASY</p><h1>Create account</h1><p class="muted">Create an account to place and track orders.</p><label>Full name<input name="name" required maxlength="100" placeholder="Your name"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><button class="btn btn-primary btn-wide">Register</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></div>{% endblock %}
